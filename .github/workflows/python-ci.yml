name: Python CI

on:
  push:
    branches: [ "main" ]  # Run the workflow on pushes to the main branch
  pull_request:
    branches: [ "main" ]  # Run the workflow on pull requests targeting the main branch

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner provided by GitHub

    steps:
      - name: Checkout repository
        # This step checks out your repository code so the workflow can access it
        uses: actions/checkout@v4

      - name: Set up Python
        # This step installs and configures Python 3.11 on the runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # This step installs Python dependencies listed in requirements.txt
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests with pytest
        # This step runs the test suite using pytest
        run: |
          pytest

      - name: Simulated deployment
        # This step simulates a deployment stage in the pipeline
        run: |
          echo "Deploying app..."
